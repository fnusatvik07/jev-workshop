[project]
name = "jev-workshop"
version = "1.0.0"
description = "Hands-on workshop for Jev, TypeSafe AI's System One model: 5 live notebooks, a 42-slide deck, and a fully cited reference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7.5",
    "python-dotenv>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.29.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "pillow>=10.0.0",
    "nbconvert>=7.16.0",
    "nbformat>=5.10.0",
    "python-pptx>=1.0.0",
]

[tool.uv]
package = false
